<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猜猜政黨 Guess the Party</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e4e2dc;
  --dpp:#1b9431; --kmt:#1f3fa8; --tpp:#1fb5b5; --ok:#1b9431; --bad:#c8352b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141416; --card:#1f1f23; --ink:#f2f2f4; --muted:#a0a0a8; --line:#33333a;
    --kmt:#5b7cf0; --tpp:#3fd0d0; --dpp:#3dbb57;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}
.lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.muted{color:var(--muted);font-size:14px}
.modes{display:grid;gap:8px;margin:14px 0}
.mode{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--card)}
.mode input{accent-color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.5;cursor:wait}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.photo{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--line);margin-bottom:12px}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;filter:grayscale(1) contrast(1.05);transition:filter .4s}
.photo.shown img{filter:none}
.photo .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;color:var(--muted)}
.credit{position:absolute;right:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;border-radius:6px;text-decoration:none}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);margin-bottom:6px}
.choices{display:grid;gap:8px}
.choice{border:2px solid var(--c);color:var(--c);background:transparent;border-radius:12px;padding:12px;font-size:16px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.choice small{font-weight:500;opacity:.8}
.choice.picked{background:var(--c);color:#fff}
.choice:disabled{cursor:default}
.reveal{margin-top:12px;border-left:6px solid var(--c);padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--c) 10%,transparent)}
.reveal b{font-size:18px}
.verdict{font-weight:700;margin-bottom:4px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.fact{margin-top:6px;font-size:14px}
.next{margin-top:12px}
.result-score{font-size:44px;font-weight:800;text-align:center;margin:8px 0}
.list{margin:12px 0 16px;padding:0;list-style:none;display:grid;gap:6px}
.list li{display:flex;justify-content:space-between;font-size:14px;border-bottom:1px solid var(--line);padding:6px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
footer{margin-top:20px;font-size:12px;color:var(--muted)}
footer a{color:inherit}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">猜猜政黨</h1>
    <button class="lang" id="langBtn">English</button>
  </header>

  <!-- Start -->
  <section id="start" class="card">
    <p id="intro"></p>
    <div class="modes" id="modes"></div>
    <label class="mode"><input type="checkbox" id="showName"> <span id="showNameLbl"></span></label>
    <div style="height:12px"></div>
    <button class="btn" id="startBtn" disabled></button>
    <p class="muted" id="loadMsg" style="margin-bottom:0"></p>
  </section>

  <!-- Game -->
  <section id="game" class="card hidden">
    <div class="row"><span id="qNum"></span><span id="score"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="photo" id="photo"></div>
    <div id="hint"></div>
    <div class="choices" id="choices"></div>
    <div id="reveal"></div>
  </section>

  <!-- Result -->
  <section id="result" class="card hidden">
    <div class="muted" id="resLbl" style="text-align:center"></div>
    <div class="result-score" id="resScore"></div>
    <p id="resMsg" style="text-align:center"></p>
    <ul class="list" id="resList"></ul>
    <button class="btn" id="againBtn"></button>
  </section>

  <footer id="footer"></footer>
</div>

/* ============ 狀態 STATE ============ */
let lang = (navigator.language||"").startsWith("zh") ? "zh" : "en";
let mode = "all", rounds = [], idx = 0, score = 0, answered = false;
const $ = id => document.getElementById(id);
const L = (pair) => Array.isArray(pair) ? pair[lang==="zh"?0:1] : pair;

/* ============ 維基照片 PHOTOS ============ */
const CACHE_KEY = "partyGuessPhotos_v2", CACHE_DAYS = 7;
function loadCache(){ try{ const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
  if(c && Date.now()-c.t < CACHE_DAYS*864e5) return c.d; }catch(e){} return {}; }
function saveCache(d){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(),d})); }catch(e){} }

// 一次查 50 個固定條目（不用搜尋），避免被維基限流、也不會抓到同名的人
async function fetchBatch(list){
  const titles = list.map(p=>p.wiki||p.zh);
  const url = "https://zh.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&converttitles=1"
    + "&prop=pageimages|info&inprop=url&piprop=thumbnail&pithumbsize=600&pilicense=free&titles="
    + encodeURIComponent(titles.join("|"));
  const j = await (await fetch(url)).json();
  const back = {};
  (j.query.normalized||[]).forEach(x=>back[x.to]=x.from);
  (j.query.converted||[]).forEach(x=>back[x.to]=back[x.from]||x.from);
  (j.query.redirects||[]).forEach(x=>back[x.to]=back[x.from]||x.from);
  const res = {};
  Object.values(j.query.pages).forEach(pg=>{
    const t = back[pg.title]||pg.title;
    res[t] = pg.thumbnail ? {img:pg.thumbnail.source, page:pg.fullurl} : {img:null};
  });
  list.forEach(p=>{ const r=res[p.wiki||p.zh]; if(r) Object.assign(p,{img:r.img,page:r.page}); });
  return res;
}

async function loadPhotos(){
  const cache = loadCache();
  $("loadMsg").textContent = T[lang].loading;
  PEOPLE.forEach(p=>{ if(p.photo){p.img=p.photo;p.page=null;} else if(cache[p.zh]){p.img=cache[p.zh].img;p.page=cache[p.zh].page;} });
  const todo = PEOPLE.filter(p=>!p.photo && !(p.zh in cache));
  for(let i=0;i<todo.length;i+=50){
    const chunk = todo.slice(i,i+50);
    try{ await fetchBatch(chunk); chunk.forEach(p=>cache[p.zh]={img:p.img||null,page:p.page||null}); }catch(e){}
  }
  saveCache(cache);
  const n = PEOPLE.filter(p=>p.img).length;
  $("loadMsg").textContent = T[lang].ready(n) + (n<PEOPLE.length ? "　"+T[lang].noPhoto : "");
  $("startBtn").disabled = false;
}

/* ============ 畫面 UI ============ */
function renderStatic(){
  const t=T[lang]; document.documentElement.lang = lang==="zh"?"zh-Hant-TW":"en";
  $("title").textContent=t.title; $("langBtn").textContent=t.lang; $("intro").textContent=t.intro;
  $("showNameLbl").textContent=t.showName; $("startBtn").textContent=t.start;
  $("againBtn").textContent=t.again; $("resLbl").textContent=t.resLbl; $("footer").textContent=t.footer;
  $("modes").innerHTML = t.modes.map(([k,l])=>
    `<label class="mode"><input type="radio" name="mode" value="${k}" ${k===mode?"checked":""}> ${l}</label>`).join("");
  document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>mode=r.value);
  if(!$("game").classList.contains("hidden")) renderQ(true);
  if(!$("result").classList.contains("hidden")) renderResult();
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function startGame(){
  let pool = PEOPLE.filter(p=>p.img && (mode==="all"||(mode==="leg"?p.leg:p.group===mode)));
  // 確保三黨都有機會出現：先各抽一位，再隨機補滿
  const pick=[]; ["DPP","KMT","TPP"].forEach(k=>{const c=shuffle(pool.filter(p=>p.party===k)); if(c[0]) pick.push(c[0]);});
  const rest = shuffle(pool.filter(p=>!pick.includes(p)));
  rounds = shuffle(pick.concat(rest).slice(0, Math.min(10,pool.length))).map(p=>({p,guess:null}));
  idx=0; score=0;
  $("start").classList.add("hidden"); $("result").classList.add("hidden"); $("game").classList.remove("hidden");
  renderQ();
}

function renderQ(keep){
  const t=T[lang], r=rounds[idx], p=r.p; if(!keep) answered=false;
  $("qNum").textContent=t.q(idx+1,rounds.length); $("score").textContent=t.score(score);
  $("prog").style.width = (idx/rounds.length*100)+"%";
  $("photo").innerHTML = `<div class="ph">?</div><img alt="" src="${p.img}" onload="this.previousSibling.remove()" onerror="this.remove()">`
    + (p.page?`<a class="credit" href="${p.page}" target="_blank" rel="noopener">${t.credit}: Wikipedia</a>`:"");
  $("photo").classList.toggle("shown", answered);
  const showName = $("showName").checked;
  $("hint").innerHTML = (showName? `<div class="tag">${lang==="zh"?p.zh:p.en}</div>` : "");
  $("choices").innerHTML = Object.entries(PARTIES).map(([k,v])=>
    `<button class="choice ${r.guess===k?"picked":""}" style="--c:${v.c}" data-k="${k}" ${answered?"disabled":""}>
      <span>${lang==="zh"?v.zh:v.en}</span><small>${L(v.full)}</small></button>`).join("");
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(b.dataset.k));
  if(answered) renderReveal(); else $("reveal").innerHTML="";
}

function answer(k){
  if(answered) return; answered=true;
  const r=rounds[idx]; r.guess=k; if(k===r.p.party) score++;
  renderQ(true);
}

function renderReveal(){
  const t=T[lang], r=rounds[idx], p=r.p, pt=PARTIES[p.party], ok=r.guess===p.party;
  const sub = [p.role?L(p.role):"", p.race?t.race+L(p.race):"", (p.leg&&!p.role)?(lang==="zh"?"現任立法委員":"Current Legislator"):""].filter(Boolean).join("　");
  $("reveal").innerHTML = `<div class="reveal" style="--c:${pt.c}">
      <div class="verdict ${ok?"ok":"bad"}">${ok?t.ok:t.bad}</div>
      <b>${p.zh}</b> ${p.en} · <span style="color:${pt.c};font-weight:700">${L(pt.full)}</span>
      <div class="muted">${sub}</div>
      ${p.fact?`<div class="fact">💡 ${L(p.fact)}</div>`:""}
    </div>
    <button class="btn next" id="nextBtn">${idx+1<rounds.length?t.next:t.finish}</button>`;
  $("score").textContent=t.score(score);
  $("nextBtn").onclick=()=>{ idx++; if(idx<rounds.length) renderQ(); else showResult(); };
}

function showResult(){ $("game").classList.add("hidden"); $("result").classList.remove("hidden"); renderResult(); }
function renderResult(){
  const t=T[lang];
  $("resScore").textContent = `${score} / ${rounds.length}`;
  $("resMsg").textContent = t.msg(score/rounds.length);
  $("resList").innerHTML = rounds.map(({p,guess})=>{
    const pt=PARTIES[p.party];
    return `<li><span><span class="dot" style="background:${pt.c}"></span>${lang==="zh"?p.zh:p.en}</span>
      <span>${guess===p.party?"✅":"❌"} ${lang==="zh"?pt.zh:pt.en}</span></li>`;}).join("");
}

$("langBtn").onclick=()=>{ lang = lang==="zh"?"en":"zh"; renderStatic(); };
$("startBtn").onclick=startGame;
$("againBtn").onclick=()=>{ $("result").classList.add("hidden"); $("start").classList.remove("hidden"); };
renderStatic();
loadPhotos();
</script>
